[project]
name = "applicant_employee_match"
version = "0.1"
description = "applicant employee match algorithm and app"
dependencies = [
    "pydantic==2.4.0",
    "flake8",
    "mypy",
    "pytest",
    "yapf",
    "pyproject-toml",
    "black",
    "ruff",
]

[tool.mypy]
[[toolmypy.overrides]]
module = []
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
addopts = [
    "--import-mode=importlib",
]